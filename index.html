<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý TSTC</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 10px; background-color: #f0f2f5; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; margin-top: 0; font-size: 20px; margin-bottom: 5px; }
        
        .device-info { font-size: 12px; color: #5f6368; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .btn-rename { background: none; border: none; color: #1a73e8; cursor: pointer; text-decoration: underline; font-size: 12px; padding: 0; }
        
        .mode-container { display: flex; justify-content: space-between; margin-bottom: 15px; background: #eee; padding: 5px; border-radius: 8px; }
        .mode-btn { flex: 1; padding: 10px 5px; border: none; background: transparent; font-weight: bold; font-size: 13px; cursor: pointer; border-radius: 6px; transition: all 0.3s; }
        .mode-nhap.active { background: #2e7d32; color: white; }
        .mode-xuat.active { background: #c62828; color: white; }
        .mode-kiem.active { background: #1565c0; color: white; }
        
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; }
        .status-box { margin: 12px 0; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 14px; }
        .loading { background: #e8f0fe; color: #1a73e8; }
        .ready { background: #e6f4ea; color: #137333; }
        .btn-action { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; display: none; }
        .btn-report { width: 100%; padding: 12px; background: #37474f; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; display: none; }
        
        .history-title { text-align: left; margin: 15px 0 5px 0; font-weight: bold; font-size: 14px; color: #5f6368; }
        .history-list { text-align: left; background: #f8f9fa; border-radius: 6px; padding: 5px; min-height: 80px; font-size: 13px; }
        .history-item { padding: 6px 10px; border-bottom: 1px solid #eee; display: block; }
        .success-text { color: #137333; font-weight: bold; }
        .duplicate-text { color: #c5221f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>QUẢN LÝ TSTC</h2>
    
    <div class="device-info">
        <span>Thiết bị: <b id="lblDeviceName">Đang nhận diện...</b></span>
        <button class="btn-rename" onclick="doiTenThietBi()">(Đổi tên)</button>
    </div>
    
    <div class="mode-container">
        <button id="btnNhap" class="mode-btn mode-nhap active" onclick="doiCheDo('NHẬP KHO')">NHẬP KHO</button>
        <button id="btnXuat" class="mode-btn mode-xuat" onclick="doiCheDo('XUẤT KHO')">XUẤT KHO</button>
        <button id="btnKiem" class="mode-btn mode-kiem" onclick="doiCheDo('KIỂM KHO')">KIỂM KHO</button>
    </div>
    
    <div id="status" class="status-box loading">Đang tải dữ liệu bộ nhớ...</div>
    <div id="reader"></div>
    
    <!-- Các nút chức năng xuất dữ liệu -->
    <button id="btnBaoCao" class="btn-action" onclick="chayBaoCaoKetQua()">BẤM XUẤT BÁO CÁO KIỂM KHO</button>
    <button id="btnDinhKy" class="btn-report" onclick="chayBaoCaoTongHop()">XUẤT BÁO CÁO NHẬP - XUẤT - TỒN</button>
    
    <div class="history-title">3 lượt quét gần nhất:</div>
    <div id="history" class="history-list">
        <div style="color:#9aa0a6; padding: 25px; text-align:center;">Chưa có dữ liệu quét</div>
    </div>
</div>

<script>
    // =========================================================================
    // DÁN ĐƯỜNG LINK WEB APP GOOGLE APPS SCRIPT MỚI CỦA BẠN VÀO GIỮA HAI DẤU NHÁY DƯỚI ĐÂY:
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwE7nvVHb7pcs51Z4taACe7KmJ21DLTovDSm9EYJm7xZK4Rab9INi1LgQ0ZqDeITYk-sg/exec";
    // =========================================================================

    let currentMode = "NHẬP KHO";
    let nameThietBi = "";
    let danhSachGoc = [];
    let danhSachDaQuetTrongPhien = new Set();
    let lichSuQuetGanNhat = [];
    let html5QrcodeScanner = null;
    let dangXuLyQuet = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function phatTiengBip(duration, frequency, times, delay) {
        let callback = function() {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = "square"; 
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration/1000);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration/1000);
        };
        for (let i = 0; i < times; i++) {
            setTimeout(callback, i * delay);
        }
    }

    function cauHinhTenThietBi() {
        let savedName = localStorage.getItem("kho_device_name");
        if (savedName) {
            nameThietBi = savedName;
        } else {
            let userAgent = navigator.userAgent || navigator.vendor || window.opera;
            if (/android/i.test(userAgent)) {
                nameThietBi = "Máy_Android";
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                nameThietBi = "Máy_iPhone";
            } else {
                nameThietBi = "Máy_Tính_Web";
            }
            localStorage.setItem("kho_device_name", nameThietBi);
        }
        document.getElementById("lblDeviceName").innerText = nameThietBi;
    }

    function doiTenThietBi() {
        let n = prompt("Nhập tên gợi nhớ cho điện thoại này:", nameThietBi);
        if (n && n.trim() !== "") {
            nameThietBi = n.trim().replace(/\s+/g, '_');
            localStorage.setItem("kho_device_name", nameThietBi);
            document.getElementById("lblDeviceName").innerText = nameThietBi;
        }
    }

    function doiCheDo(cheDo) {
        currentMode = cheDo;
        document.getElementById("btnNhap").classList.remove("active");
        document.getElementById("btnXuat").classList.remove("active");
        document.getElementById("btnKiem").classList.remove("active");
        document.getElementById("btnBaoCao").style.display = "none";
        document.getElementById("btnDinhKy").style.display = "none";
        danhSachDaQuetTrongPhien.clear();
        
        if(cheDo === "NHẬP KHO") document.getElementById("btnNhap").classList.add("active");
        if(cheDo === "XUẤT KHO") document.getElementById("btnXuat").classList.add("active");
        if(cheDo === "KIỂM KHO") {
            document.getElementById("btnKiem").classList.add("active");
            document.getElementById("btnBaoCao").style.display = "block";
            document.getElementById("btnDinhKy").style.display = "block"; // Hiện nút BC định kỳ
        }
        phatTiengBip(80, 800, 1, 0);
    }

    async function loadDuLieuBanDau() {
        cauHinhTenThietBi();
        try {
            let response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getData`);
            let resData = await response.json();
            danhSachGoc = resData.listDS;
            document.getElementById("status").className = "status-box ready";
            document.getElementById("status").innerText = "Hệ thống sẵn sàng!";
            khoiDongCamera();
        } catch (error) {
            document.getElementById("status").className = "status-box";
            document.getElementById("status").style.backgroundColor = "#fce8e6";
            document.getElementById("status").innerText = "Lỗi mạng! Vui lòng tải lại trang.";
        }
    }

    function khoiDongCamera() {
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 15, qrbox: { width: 230, height: 230 } }, onScanSuccess);
    }

    async function onScanSuccess(decodedText) {
        if (dangXuLyQuet) return;
        dangXuLyQuet = true;
        
        let maMaHoa = decodedText.trim();
        if (danhSachDaQuetTrongPhien.has(maMaHoa)) {
            phatTiengBip(100, 650, 2, 150);
            capNhatGiaoDienLichSu("TRÙNG LẶP", "Mã này vừa quét xong", "duplicate-text");
            setTimeout(() => { dangXuLyQuet = false; }, 2000);
            return;
        }

        let phanTu = maMaHoa.split("-");
        let soHD = phanTu[0] ? phanTu[0].trim() : maMaHoa;
        let sLuong = phanTu[1] ? Number(phanTu[1].trim()) : 1;
        let hoTen = phanTu[2] ? phanTu[2].trim() : "Không rõ";
        let tenTS = phanTu[3] ? phanTu[3].trim() : "Chưa phân loại";

        let trangThaiKhoGoc = danhSachGoc.find(item => item.soHD === soHD);
        
        if (currentMode === "NHẬP KHO" && trangThaiKhoGoc && trangThaiKhoGoc.trangThai === "Trong kho") {
            phatTiengBip(100, 650, 2, 150);
            capNhatGiaoDienLichSu(soHD, "LỖI: Tài sản đã có trong kho!", "duplicate-text");
            setTimeout(() => { dangXuLyQuet = false; }, 2000);
            return;
        }
        if (currentMode === "XUẤT KHO" && (!trangThaiKhoGoc || trangThaiKhoGoc.trangThai === "Đã xuất")) {
            phatTiengBip(100, 650, 2, 150);
            capNhatGiaoDienLichSu(soHD, "LỖI: Không tìm thấy tồn kho để xuất!", "duplicate-text");
            setTimeout(() => { dangXuLyQuet = false; }, 2000);
            return;
        }

        phatTiengBip(150, 950, 1, 0);
        danhSachDaQuetTrongPhien.add(maMaHoa);
        
        if (currentMode === "NHẬP KHO") danhSachGoc.push({ soHD: soHD, hoten: hoTen, sluong: sLuong, trangThai: "Trong kho" });
        if (currentMode === "XUẤT KHO" && trangThaiKhoGoc) trangThaiKhoGoc.trangThai = "Đã xuất";

        capNhatGiaoDienLichSu(soHD, `${currentMode} thành công (${sLuong} quyển)`, "success-text");

        let PostURL = GOOGLE_SCRIPT_URL + 
                      "?maQuet=" + encodeURIComponent(maMaHoa) +
                      "&thoiGian=" + encodeURIComponent(new Date().toLocaleString("vi-VN")) +
                      "&email=" + encodeURIComponent(nameThietBi) +
                      "&soHD=" + encodeURIComponent(soHD) +
                      "&sluong=" + sLuong +
                      "&hoten=" + encodeURIComponent(hoTen) +
                      "&tstc=" + encodeURIComponent(tenTS) +
                      "&loaiThaoTac=" + encodeURIComponent(currentMode);

        fetch(PostURL, { method: "POST" }).then(() => { dangXuLyQuet = false; }).catch(() => { dangXuLyQuet = false; });
    }

    function capNhatGiaoDienLichSu(ma, trangThai, classMau) {
        lichSuQuetGanNhat.unshift({ ma: ma, trangThai: trangThai, classMau: classMau });
        if (lichSuQuetGanNhat.length > 3) lichSuQuetGanNhat.pop();
        let htmlContent = "";
        lichSuQuetGanNhat.forEach(item => {
            htmlContent += `<div class="history-item">Mã: <b>${item.ma}</b> -> <span class="${item.classMau}">${item.trangThai}</span></div>`;
        });
        document.getElementById("history").innerHTML = htmlContent;
    }

    async function chayBaoCaoKetQua() {
        if (!confirm("Xác nhận đối chiếu dữ liệu đợt KIỂM KHO này?")) return;
        document.getElementById("status").className = "status-box loading";
        document.getElementById("status").innerText = "Đang đối chiếu...";
        try {
            await fetch(`${GOOGLE_SCRIPT_URL}?action=tinhKetQua`);
            document.getElementById("status").className = "status-box ready";
            document.getElementById("status").innerText = `Đã xuất báo cáo!`;
            alert(`Đã xuất kết quả kiểm kho sang Sheet 'KetQua'.`);
        } catch (e) {
            document.getElementById("status").className = "status-box ready";
            document.getElementById("status").innerText = "Lỗi hệ thống!";
        }
    }

    // Hàm gọi xử lý tính Nhập - Xuất - Tồn định kỳ mới
    async function chayBaoCaoTongHop() {
        if (!confirm("Hệ thống sẽ tính toán Nhập-Xuất-Tồn theo mốc thời gian tại H1, H2 của sheet 'BaoCao'. Xác nhận chạy?")) return;
        document.getElementById("status").className = "status-box loading";
        document.getElementById("status").innerText = "Đang tổng hợp số liệu kho...";
        try {
            let res = await fetch(`${GOOGLE_SCRIPT_URL}?action=chayBaoCaoDinhKy`);
            let data = await res.json();
            document.getElementById("status").className = "status-box ready";
            if(data.status === "success") {
                document.getElementById("status").innerText = `Đã tổng hợp xong báo cáo định kỳ!`;
                alert(`Đã xuất báo cáo Nhập-Xuất-Tồn thành công sang Sheet 'BaoCao'!`);
            } else {
                document.getElementById("status").className = "status-box";
                document.getElementById("status").style.backgroundColor = "#fce8e6";
                document.getElementById("status").innerText = data.msg;
                alert(data.msg);
            }
        } catch (e) {
            document.getElementById("status").className = "status-box ready";
            document.getElementById("status").innerText = "Lỗi hệ thống báo cáo!";
        }
    }

    window.onload = loadDuLieuBanDau;
</script>
</body>
</html>
